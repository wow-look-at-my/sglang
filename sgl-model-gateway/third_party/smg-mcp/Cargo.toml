[package]
name = "smg-mcp"
version = "1.0.0"
edition = "2021"
description = "Model Context Protocol (MCP) client implementation"
license = "Apache-2.0"
repository = "https://github.com/lightseekorg/smg"
authors = [
    "Simo Lin <linsimo.mark@gmail.com>",
    "Chang Su <mckvtl@gmail.com>",
    "Keyang Ru <rukeyang@gmail.com>",
]
keywords = ["mcp", "smg", "llm", "tools"]
categories = ["api-bindings"]
publish = false

[lib]
name = "smg_mcp"

[dependencies]
openai-protocol = "=1.0.0"
async-trait = "0.1"
axum = "0.8.6"
backoff = { version = "0.4", features = ["tokio", "futures"] }
dashmap = "6.1.0"
lru = "0.16.2"
parking_lot = "0.12.4"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json", "stream"] }
futures = "0.3"
sse-stream = "0.2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0.12"
tokio = { version = "1.42.0", features = ["sync", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
url = "2.5"
rmcp = { version = "3.4.1", features = ["client", "server",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
    "reqwest",
    "auth"] }

[dev-dependencies]
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros"] }
