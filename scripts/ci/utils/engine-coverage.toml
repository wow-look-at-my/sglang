# Line coverage of python/sglang for the CPU test stage, read by `coverage --rcfile`.
[tool.coverage.run]
source_dirs = ["${GITHUB_WORKSPACE}/python/sglang"]
data_file = "${GITHUB_WORKSPACE}/.coverage-engine/.coverage"
core = "sysmon"
# run_suite forks a child per test file that leaves through os._exit, and tests launch servers as python subprocesses.
patch = ["subprocess", "_exit"]
parallel = true
# Processes that never import sglang would otherwise print these to stderr, which some tests read.
disable_warnings = ["no-data-collected", "module-not-measured", "module-not-imported"]

[tool.coverage.report]
precision = 2
ignore_errors = true
