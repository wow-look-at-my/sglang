name: PR Test SGLang Simulator (CPU)

on:
  workflow_call:
    inputs:
      check_changes:
        description: 'toJson(needs.check-changes.outputs).'
        type: string
        required: true
      caller_inputs:
        description: 'toJson(inputs) from the caller workflow.'
        type: string
        required: true
      rust_ext_artifact:
        description: 'Artifact of prebuilt Rust extension modules.'
        type: string
        default: ''
      sched_policy_handoff:
        description: 'cache-upload name of the sched-policy build/ (Fork CI sched-policy-build). The install step fails when it is empty or missing.'
        type: string
        default: ''
      goipc_handoff:
        description: 'cache-upload name of libgoipc.so (Fork CI sched-policy-build). The install step fails when it is empty or missing.'
        type: string
        default: ''
      coverage_artifact:
        description: 'Non-empty measures python/sglang line coverage (scripts/ci/utils/engine-coverage.toml) and uploads it as this artifact.'
        type: string
        default: ''

env:
  SGLANG_IS_IN_CI: true
  SKIP_PR_TEST_HEALTH_CHECK: ${{ (fromJson(inputs.caller_inputs).skip_pr_test_health_check || fromJson(inputs.caller_inputs).test_parallel_dispatch || fromJson(inputs.caller_inputs).run_all_tests) && 'true' || 'false' }}
  PR_TEST_BYPASS_MAINTENANCE_ON_MAIN: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
  USE_VENV: false

jobs:
  run:
    name: simulator-test-cpu (${{ matrix.test }})
    if: fromJson(inputs.check_changes).main_package == 'true' || fromJson(inputs.check_changes).simulator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        test:
          - test_simulation_sglang_runner.py
          - test_simulation_sglang_serving.py
          - test_simulation_cache_hit_ratio.py
          - test_simulation_offline_blocking.py
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(inputs.caller_inputs).git_ref || github.sha }}

      # git_ref picks the code under test; the scripts this workflow calls come from the workflow's own commit.
      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          path: .ci-tooling
          sparse-checkout: scripts/ci/utils

      - uses: ./.github/actions/check-pr-test-health

      - uses: ./.github/actions/check-maintenance

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: ./.github/actions/download-rust-ext
        id: rust_ext
        with:
          artifact_name: ${{ inputs.rust_ext_artifact }}

      - name: Install protoc + Rust toolchain
        if: ${{ steps.rust_ext.outputs.hit != 'true' }}
        timeout-minutes: 10
        run: bash scripts/ci/utils/install_rust_protoc.sh

      - name: Rust cache (rust/ workspace)
        if: ${{ steps.rust_ext.outputs.hit != 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: "sglang-grpc-cpu"

      - name: Install dependencies
        timeout-minutes: 20
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          OVERRIDE_ARGS=$(bash scripts/ci/utils/uv_kernel_pin_override.sh)
          uv pip install -e "python" --index-strategy unsafe-best-match --prerelease allow $OVERRIDE_ARGS
          uv pip install pytest "coverage>=7.10"
          uv pip install -e "tools/sglang-simulator[aic]"

      - name: Prebuild HiCache native hash extension
        timeout-minutes: 5
        env:
          MALLOC_ARENA_MAX: "2"
          MAX_JOBS: "1"
          TORCH_EXTENSIONS_DIR: ${{ runner.temp }}/torch-extensions
        run: |
          python3 -c \
            'from sglang.srt.mem_cache.cpp_utils.native_hash import get_native_hash; get_native_hash([1], None)'

      # Every scheduler spawns the Go policy process and reaches it over goipc.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ${{ inputs.sched_policy_handoff }}
          path: ${{ runner.temp }}/sched-policy

      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ${{ inputs.goipc_handoff }}
          path: ${{ runner.temp }}/libgoipc

      - name: Install the policy process and libgoipc
        run: bash .ci-tooling/scripts/ci/utils/install_sched_policy_runtime.sh install "${{ runner.temp }}/sched-policy" "${{ runner.temp }}/libgoipc"

      - name: Run SGLang Simulator compatibility tests
        timeout-minutes: 10
        env:
          MALLOC_ARENA_MAX: "2"
          MAX_JOBS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_ADDOPTS: "-s"
          TORCH_EXTENSIONS_DIR: ${{ runner.temp }}/torch-extensions
        run: |
          PYTHON=(python3)
          if [ -n "${{ inputs.coverage_artifact }}" ]; then
            mkdir -p "$GITHUB_WORKSPACE/.coverage-engine"
            PYTHON=(python3 -m coverage run --rcfile="$GITHUB_WORKSPACE/.ci-tooling/scripts/ci/utils/engine-coverage.toml")
          fi
          "${PYTHON[@]}" -m pytest -q "tools/sglang-simulator/test/${{ matrix.test }}"

      - name: Combine coverage
        if: ${{ !cancelled() && inputs.coverage_artifact != '' }}
        run: python3 -m coverage combine --rcfile="$GITHUB_WORKSPACE/.ci-tooling/scripts/ci/utils/engine-coverage.toml"

      - name: Upload coverage
        if: ${{ !cancelled() && inputs.coverage_artifact != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: leg-${{ inputs.coverage_artifact }}-${{ strategy.job-index }}
          path: .coverage-engine/.coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # One coverage artifact per call, whatever the number of legs above.
  coverage:
    name: simulator-test-cpu coverage
    needs: run
    if: ${{ !cancelled() && inputs.coverage_artifact != '' && needs.run.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci/utils

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install coverage
        run: pip install "coverage>=7.10"

      - uses: actions/download-artifact@v4
        with:
          pattern: leg-${{ inputs.coverage_artifact }}-*
          path: ${{ runner.temp }}/legs

      - name: Combine the legs
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          PARTS=("${{ runner.temp }}"/legs/*/.coverage)
          if [ "${#PARTS[@]}" -eq 0 ]; then
            echo "::error::no simulator-test-cpu leg uploaded coverage"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.coverage-engine"
          python3 -m coverage combine --rcfile="$GITHUB_WORKSPACE/scripts/ci/utils/engine-coverage.toml" "${PARTS[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.coverage_artifact }}
          path: .coverage-engine/.coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
