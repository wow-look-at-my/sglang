name: Fork CI image prune

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the deletions without deleting anything'
        type: boolean
        default: false
  delete:

# Bound the API cost when the same ref fires repeatedly.
concurrency:
  group: fork-ci-image-prune-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  prune:
    name: Prune images
    if: github.repository != 'sgl-project/sglang'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Delete the images Fork CI no longer keeps
        run: |
          set -euo pipefail
          export GH_TOKEN="${{ github.token }}"
          DRY_RUN=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN=--dry-run
          fi
          python3 scripts/ci/utils/prune_ghcr_images.py \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --repository "${GITHUB_REPOSITORY}" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --deleted-ref "${{ github.event_name == 'delete' && github.event.ref || '' }}" \
            $DRY_RUN
