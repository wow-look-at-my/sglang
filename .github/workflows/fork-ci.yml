name: Fork CI

# CI for forks of sgl-project/sglang, on GitHub-hosted runners only. Upstream workflows build on self-hosted pools (x64-kernel-build-node, x64-docker-build-node, GPU runners) and publish with Docker Hub / PyPI secrets that a fork does not have. Every job of those workflows, *-finish aggregators included, starts its `if:` with github.repository == 'sgl-project/sglang', so on a fork they all report skipped. This workflow is the fork's replacement and skips upstream.

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Commit whose code the CPU test jobs run and the coverage report measures, with this ref's workflows (default: the dispatched ref)"
        type: string
        default: ""

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  fork-plan:
    if: github.repository != 'sgl-project/sglang'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      kernel_version: ${{ steps.plan.outputs.kernel_version }}
      kernel_key: ${{ steps.plan.outputs.kernel_key }}
      kernel_released: ${{ steps.plan.outputs.kernel_released }}
      cuda_archs: ${{ steps.plan.outputs.cuda_archs }}
      build_kernel: ${{ steps.plan.outputs.build_kernel }}
      publish_kernel: ${{ steps.plan.outputs.publish_kernel }}
      on_default: ${{ steps.plan.outputs.on_default }}
      build_docker: ${{ steps.plan.outputs.build_docker }}
      image_tags: ${{ steps.plan.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Decide what to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CUDA_ARCHS: ${{ vars.FORK_KERNEL_CUDA_ARCHS || '80;120a' }}
        run: |
          set -euo pipefail
          KERNEL_VERSION=$(grep -Po '(?<=^version = ")[^"]*' python/sglang/kernels/aot/pyproject.toml)
          echo "kernel_version=${KERNEL_VERSION}" >> "$GITHUB_OUTPUT"

          # Everything the wheel is built from: the AOT source tree (submodule pins included), the archs, and the CUDA and Python versions fork-sgl-kernel-wheel passes to build.sh.
          AOT_TREE=$(git rev-parse HEAD:python/sglang/kernels/aot)
          KERNEL_KEY=$(printf 'aot=%s archs=%s cuda=13.0 python=3.12\n' "$AOT_TREE" "$CUDA_ARCHS" | sha256sum | cut -d' ' -f1)
          KERNEL_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sglang:sgl-kernel-wheel-x86_64-${KERNEL_KEY}"
          if INSPECT=$(docker buildx imagetools inspect "$KERNEL_IMAGE" 2>&1); then
            KERNEL_CACHED=true
          elif printf '%s\n' "$INSPECT" | grep -q 'not found'; then
            KERNEL_CACHED=false
          else
            echo "::error::cannot look up ${KERNEL_IMAGE}: ${INSPECT}"
            exit 1
          fi

          ON_DEFAULT=false
          if [ "$GITHUB_REF" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            ON_DEFAULT=true
          fi

          # The image installs only this fork's kernel build, so a PyPI wheel of
          # the same version does not count: it lacks the fork's ops and archs.
          KERNEL_AVAILABLE=false
          if gh release view "sglang-kernel-v${KERNEL_VERSION}" --repo "$GITHUB_REPOSITORY" \
               --json assets --jq ".assets[].name" 2>/dev/null | grep -q "_x86_64\.whl$"; then
            KERNEL_AVAILABLE=true
          fi

          # Every push builds the image, so a Dockerfile change is proven before it merges. A branch publishes only its own dev-<branch> tag.
          BUILD_DOCKER=false
          if [ "${{ github.event_name }}" = push ]; then
            BUILD_DOCKER=true
          fi

          # KERNEL_KEY changes exactly when the AOT tree or the build parameters do, so a missing wheel is the only reason to build.
          BUILD_KERNEL=false
          if [ "$KERNEL_CACHED" = false ]; then
            BUILD_KERNEL=true
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$ON_DEFAULT" = true ]; then
            IMAGE_TAGS="dev dev-${SHORT_SHA}"
          else
            IMAGE_TAGS="dev-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-100)"
          fi

          {
            echo "kernel_key=${KERNEL_KEY}"
            echo "kernel_released=${KERNEL_AVAILABLE}"
            echo "cuda_archs=${CUDA_ARCHS}"
            echo "build_kernel=${BUILD_KERNEL}"
            echo "publish_kernel=${ON_DEFAULT}"
            echo "on_default=${ON_DEFAULT}"
            echo "build_docker=${BUILD_DOCKER}"
            echo "image_tags=${IMAGE_TAGS}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Fork CI plan"
            echo "| item | value |"
            echo "|---|---|"
            echo "| sglang-kernel version | ${KERNEL_VERSION} (available: ${KERNEL_AVAILABLE}) |"
            echo "| kernel inputs key | ${KERNEL_KEY} (wheel in registry: ${KERNEL_CACHED}) |"
            echo "| build kernel wheels | ${BUILD_KERNEL} |"
            echo "| publish kernel release | ${ON_DEFAULT} |"
            echo "| build image | ${BUILD_DOCKER} (${IMAGE_TAGS}) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- CPU tests
  fork-check-changes:
    needs: fork-plan
    uses: ./.github/workflows/_pr-test-check-changes.yml
    with:
      # Pushes have no PR diff to filter on; run the whole CPU suite.
      run_all_tests: true
      # Shards are sized from base-a-test-cpu's run_timeout_minutes below, which leaves room for coverage's overhead.
      pr_test_yml: .github/workflows/fork-ci.yml

  fork-rust-ext-build:
    needs: fork-check-changes
    uses: ./.github/workflows/_pr-test-rust-ext-build.yml
    with:
      runs_on: ubuntu-22.04
      artifact_name: fork-rust-ext-x86_64

  sched-policy-build:
    needs: fork-plan
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      deployments: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    outputs:
      policy_handoff: go-build-sched-policy-build.btools-sched-policy
      goipc_handoff: sched-policy-libgoipc
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@master
        with:
          working-directory: tools/sched-policy
      - name: Build libgoipc
        run: bash scripts/ci/utils/install_sched_policy_runtime.sh build-goipc "${{ runner.temp }}/libgoipc"
      - uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: sched-policy-libgoipc
          path: ${{ runner.temp }}/libgoipc

  base-a-test-cpu:
    needs: [fork-check-changes, fork-rust-ext-build, sched-policy-build]
    permissions: {actions: read, contents: write, issues: read, pull-requests: read, id-token: write}
    if: ${{ !cancelled() && needs.fork-check-changes.result == 'success' && needs.sched-policy-build.result == 'success' }}
    uses: ./.github/workflows/_pr-test-stage-cpu.yml
    with:
      self_name: base-a-test-cpu
      check_changes: ${{ toJson(needs.fork-check-changes.outputs) }}
      caller_inputs: '{"skip_pr_test_health_check": true, "git_ref": "${{ inputs.git_ref }}"}'
      partitions: ${{ needs.fork-check-changes.outputs.partitions }}
      run_timeout_minutes: '11'
      rust_ext_artifact: ${{ needs.fork-rust-ext-build.outputs.artifact_name }}
      sched_policy_handoff: ${{ needs.sched-policy-build.outputs.policy_handoff }}
      goipc_handoff: ${{ needs.sched-policy-build.outputs.goipc_handoff }}
      coverage_artifact: engine-coverage

  fork-engine-coverage:
    needs: [fork-check-changes, base-a-test-cpu, simulator-test-cpu, base-a-test-npu]
    if: ${{ !cancelled() && needs.base-a-test-cpu.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the measured code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          path: .ci-tooling
          sparse-checkout: scripts/ci/utils

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: pip install "coverage>=7.10"

      - uses: actions/download-artifact@v4
        with:
          pattern: engine-coverage-*
          path: ${{ runner.temp }}/engine-coverage

      - name: Combine partitions and report
        run: |
          set -euo pipefail
          RC="$GITHUB_WORKSPACE/.ci-tooling/scripts/ci/utils/engine-coverage.toml"
          shopt -s nullglob dotglob
          PARTS=("${{ runner.temp }}"/engine-coverage/*/.coverage)
          EXPECTED=$(( ${{ fromJson(needs.fork-check-changes.outputs.partitions)['base-a-test-cpu'].size }} + ${{ needs.simulator-test-cpu.result != 'skipped' && 1 || 0 }} + ${{ needs.base-a-test-npu.result != 'skipped' && 1 || 0 }} ))
          if [ "${#PARTS[@]}" -ne "$EXPECTED" ]; then
            echo "::error::expected ${EXPECTED} coverage files (base-a-test-cpu partitions, plus simulator-test-cpu and base-a-test-npu when they ran), found ${#PARTS[@]}"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.coverage-engine"
          python3 -m coverage combine --rcfile="$RC" "${PARTS[@]}"
          python3 -m coverage json --rcfile="$RC" -o "${{ runner.temp }}/engine-coverage.json"
          echo "Measured commit: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r -f .ci-tooling/scripts/ci/utils/coverage_package_table.jq "${{ runner.temp }}/engine-coverage.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: combined-engine-coverage
          path: ${{ runner.temp }}/engine-coverage.json
          if-no-files-found: error

  simulator-test-cpu:
    needs: [fork-check-changes, fork-rust-ext-build, sched-policy-build]
    permissions: {actions: read, contents: write, issues: read, pull-requests: read, id-token: write}
    if: ${{ !cancelled() && needs.fork-check-changes.result == 'success' && needs.sched-policy-build.result == 'success' }}
    uses: ./.github/workflows/_pr-test-simulator-cpu.yml
    with:
      check_changes: ${{ toJson(needs.fork-check-changes.outputs) }}
      caller_inputs: '{"skip_pr_test_health_check": true, "git_ref": "${{ inputs.git_ref }}"}'
      rust_ext_artifact: ${{ needs.fork-rust-ext-build.outputs.artifact_name }}
      sched_policy_handoff: ${{ needs.sched-policy-build.outputs.policy_handoff }}
      goipc_handoff: ${{ needs.sched-policy-build.outputs.goipc_handoff }}
      coverage_artifact: engine-coverage-simulator

  # pr-test-npu.yml's hosted stage-A suite: the NPU attention-backend unit tests stub out torch_npu and sgl_kernel_npu, so a CPU runner runs them.
  base-a-test-npu:
    needs: [fork-check-changes, sched-policy-build]
    permissions: {actions: read, contents: read, id-token: write}
    if: ${{ !cancelled() && needs.fork-check-changes.result == 'success' && needs.fork-check-changes.outputs.main_package == 'true' && needs.sched-policy-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SGLANG_IS_IN_CI: true
    steps:
      - name: Checkout the code under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          path: .ci-tooling
          sparse-checkout: scripts/ci/utils

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'python/pyproject_npu.toml'

      - name: Install dependencies
        timeout-minutes: 30
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          rm -f python/pyproject.toml
          mv python/pyproject_npu.toml python/pyproject.toml
          uv pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 triton \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple/ \
            --index-strategy unsafe-best-match
          uv pip install -e "python[dev_npu]" "coverage>=7.10" --index-strategy unsafe-best-match

      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ${{ needs.sched-policy-build.outputs.policy_handoff }}
          path: ${{ runner.temp }}/sched-policy

      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ${{ needs.sched-policy-build.outputs.goipc_handoff }}
          path: ${{ runner.temp }}/libgoipc

      - name: Install the policy process and libgoipc
        run: bash .ci-tooling/scripts/ci/utils/install_sched_policy_runtime.sh install "${{ runner.temp }}/sched-policy" "${{ runner.temp }}/libgoipc"

      - name: Run NPU unit tests
        timeout-minutes: 10
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.coverage-engine"
          cd test
          python3 -m coverage run --rcfile="$GITHUB_WORKSPACE/.ci-tooling/scripts/ci/utils/engine-coverage.toml" run_suite.py --hw npu --suite base-a-test-npu

      - name: Combine coverage
        if: ${{ !cancelled() }}
        run: python3 -m coverage combine --rcfile="$GITHUB_WORKSPACE/.ci-tooling/scripts/ci/utils/engine-coverage.toml"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: engine-coverage-npu
          path: .coverage-engine/.coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------ constructor order Fails when an __init__ step reads a self field before an earlier step sets it, or when a method creates a field the constructor never initializes.
  fork-init-order-check:
    needs: fork-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/init-order-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - run: npm ci --ignore-scripts
      - run: just test
      - run: just check

  # ------------------------------------------------------------ sglang wheel
  fork-sglang-wheel:
    needs: fork-plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm derives the version from tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install protoc
        run: sudo bash scripts/ci/utils/install_protoc.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        run: |
          cd python
          cp ../README.md ../LICENSE .
          pip install build wheel "setuptools>=61.0" "setuptools-rust>=1.11" \
            "setuptools-scm>=8.0" "torch==2.13.0" --extra-index-url https://download.pytorch.org/whl/cpu
          python3 -m build --wheel --no-isolation

      - name: Repair and smoke-test wheel
        run: |
          pip install auditwheel patchelf
          python3 scripts/release/prepare_sglang_wheel.py python/dist

      - uses: actions/upload-artifact@v4
        with:
          name: sglang-wheel-py3.12-x86_64
          path: python/dist/*.whl
          if-no-files-found: error

  # ----------------------------------------------------------- model gateway Upstream builds and tests sgl-model-gateway in pr-test-rust.yml, guarded to sgl-project/sglang. The toolchain comes from sgl-model-gateway/rust-toolchain.toml.
  fork-gateway-test:
    needs: fork-plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: sgl-model-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust, protoc and system deps
        working-directory: .
        run: bash scripts/ci/cuda/ci_install_gateway_dependencies.sh

      # Cargo.lock is gitignored; resolving it first puts the exact dependency set into the rust-cache key along with the rustc version.
      - name: Resolve dependencies
        run: cargo generate-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sgl-model-gateway
          shared-key: fork-gateway-dev
          cache-on-failure: true

      - name: rustfmt
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          cargo +nightly fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # smg-mcp (third_party/) is a workspace member but not a default member.
      - name: cargo test
        timeout-minutes: 60
        run: |
          cargo test
          cargo test -p smg-mcp

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/sglang-simulator/schedsim/go.mod

      # The simulator is the proof artifact for scheduler changes, so its tests gate a push the same way the gateway's do.
      - name: scheduler simulator tests
        working-directory: tools/sglang-simulator/schedsim
        run: scripts/coverage.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: visual simulator
        working-directory: tools/sglang-simulator/schedsim/web
        run: |
          npm install --no-audit --no-fund --silent
          just check
          just test
          git diff --exit-code -- sim.js

      # The NPU precise-test selector's git fallback (used when the GitHub API is down) is covered by its own pytest suite.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: precise-test selector tests
        working-directory: .
        run: |
          pip install --quiet pytest pytest-cov regex
          python -m pytest scripts/ci/npu/precise-test/tests -q --cov=test_selector --cov-report=term-missing

  fork-gateway-wheel:
    needs: fork-plan
    # Same as upstream: ubuntu-22.04 keeps the wheel at manylinux_2_35.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: sgl-model-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust, protoc and system deps
        working-directory: .
        run: bash scripts/ci/cuda/ci_install_gateway_dependencies.sh

      - name: Resolve dependencies
        run: cargo generate-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sgl-model-gateway
          shared-key: fork-gateway-wheel
          cache-on-failure: true

      - name: Build wheel
        working-directory: sgl-model-gateway/bindings/python
        run: |
          python3 -m pip install --upgrade pip maturin
          maturin build --profile ci --features vendored-openssl --out dist

      - name: Smoke-test and run Python unit tests
        working-directory: sgl-model-gateway/bindings/python
        run: |
          pip install dist/*.whl
          python3 -c "from sglang_router.sglang_router_rs import Router; print('Rust extension: OK')"
          python3 -m sglang_router.launch_router --help > /dev/null
          pip install pytest pytest-cov
          pytest -q tests --cov=sglang_router --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=80

      - uses: actions/upload-artifact@v4
        with:
          name: sglang-router-wheel-x86_64
          path: sgl-model-gateway/bindings/python/dist/*.whl
          if-no-files-found: error

  # bindings/golang is in the gateway workspace's `exclude`, so fork-gateway-test's fmt/clippy/test never compile it and a drifted FFI signature merges silently. Built through its own manifest instead, on the same x86_64 target as the rest.
  fork-gateway-golang:
    needs: fork-plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: sgl-model-gateway/bindings/golang
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sgl-model-gateway/bindings/golang/go.mod
          # Modules sit under this path (the bindings and examples/oai_server) and the action keys its cache on one go.sum.
          cache: false

      - name: Install Rust, protoc and system deps
        working-directory: .
        run: bash scripts/ci/cuda/ci_install_gateway_dependencies.sh

      - name: Resolve dependencies
        run: cargo generate-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sgl-model-gateway/bindings/golang
          shared-key: fork-gateway-golang
          cache-on-failure: true

      # No pre-commit hook covers Go, so this is the only thing holding both trees this fork adds to the formatting the rest of them already uses.
      - name: gofmt
        working-directory: .
        run: test -z "$(gofmt -l sgl-model-gateway/bindings/golang tools/sglang-simulator/schedsim)"

      # Stable rustfmt: imports_granularity and group_imports in sgl-model-gateway/rustfmt.toml are nightly-only, so stable does not check import grouping. Run `cargo +nightly fmt --all` before widening this.
      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: Build cdylib
        run: make build-dev

      # The cgo directives name the library but not the directory it sits in, and the Makefile's CGO_LDFLAGS is what supplies it, so a `go build` of the example binaries outside make cannot link.
      - name: Build the Go SDK and examples
        run: |
          make build-go BUILD_MODE=debug
          make examples BUILD_MODE=debug

      - name: Go tests against the cdylib
        run: make test BUILD_MODE=debug

  # ------------------------------------------------------ sglang-kernel wheel
  fork-sgl-kernel-wheel:
    needs: fork-plan
    if: needs.fork-plan.outputs.build_kernel == 'true'
    name: fork-sgl-kernel-wheel (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ${{ vars.FORK_KERNEL_RUNNER_X64 || 'ubuntu-latest' }}
    runs-on: ${{ matrix.runner }}
    # Hosted-runner ceiling. A full build can outlast it on 4 cores; the ccache saved below lets the next run resume where this one stopped.
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/sgl-kernel/ccache
          key: fork-sgl-kernel-ccache-${{ matrix.arch }}-${{ needs.fork-plan.outputs.cuda_archs }}-${{ github.run_id }}
          restore-keys: fork-sgl-kernel-ccache-${{ matrix.arch }}-${{ needs.fork-plan.outputs.cuda_archs }}-

      - name: Add swap
        run: |
          sudo fallocate -l 16G /swapfile-kernel-build
          sudo chmod 600 /swapfile-kernel-build
          sudo mkswap /swapfile-kernel-build
          sudo swapon /swapfile-kernel-build
          free -g

      - name: Build wheel (Python 3.12, CUDA 13.0)
        timeout-minutes: 320
        env:
          USE_CCACHE: 1
          # Empty lets build.sh size jobs to cores and RAM + swap.
          BUILD_JOBS: ${{ vars.FORK_KERNEL_BUILD_JOBS || '' }}
          NVCC_THREADS: ${{ vars.FORK_KERNEL_NVCC_THREADS || '1' }}
          CMAKE_ARGS: -DSGL_KERNEL_CUDA_ARCHS=${{ needs.fork-plan.outputs.cuda_archs }}
        run: |
          cd python/sglang/kernels/aot
          ./build.sh 3.12 13.0

      # The build container writes the cache as root; the save step runs as the runner.
      - name: Save ccache
        if: always() && steps.ccache.outcome == 'success'
        run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/sgl-kernel/ccache || true

      - uses: actions/cache/save@v4
        if: always() && steps.ccache.outcome == 'success'
        with:
          path: ~/.cache/sgl-kernel/ccache
          key: fork-sgl-kernel-ccache-${{ matrix.arch }}-${{ needs.fork-plan.outputs.cuda_archs }}-${{ github.run_id }}

      - name: Check wheel version and ops
        run: |
          set -euo pipefail
          VERSION='${{ needs.fork-plan.outputs.kernel_version }}'
          ls -alh python/sglang/kernels/aot/dist
          WHEELS=$(ls python/sglang/kernels/aot/dist/sglang_kernel-${VERSION}+*_${{ matrix.arch }}.whl)
          python3 scripts/ci/utils/check_sgl_kernel_wheel_ops.py $WHEELS

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A one-layer image tagged by fork-plan's input key: fork-plan skips this job when the tag exists, and the image build mounts it, so the same bytes reach every image and its layer cache stays valid.
      - name: Push the wheel under its input key
        run: |
          set -euo pipefail
          REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sglang:sgl-kernel-wheel-${{ matrix.arch }}-${{ needs.fork-plan.outputs.kernel_key }}"
          printf 'FROM scratch\nCOPY *.whl /\n' | docker build -t "$REF" -f - python/sglang/kernels/aot/dist
          docker push "$REF"

  fork-sgl-kernel-release:
    needs: [fork-plan, fork-sgl-kernel-wheel]
    if: ${{ !cancelled() && needs.fork-plan.outputs.publish_kernel == 'true' && (needs.fork-sgl-kernel-wheel.result == 'success' || (needs.fork-sgl-kernel-wheel.result == 'skipped' && needs.fork-plan.outputs.kernel_released == 'false')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Fetch the wheel pushed under the kernel input key
        run: |
          set -euo pipefail
          REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sglang:sgl-kernel-wheel-x86_64-${{ needs.fork-plan.outputs.kernel_key }}"
          printf 'FROM %s\n' "$REF" | docker buildx build -o type=local,dest=wheels -f - .
          ls -alh wheels

      - name: Publish to release sglang-kernel-v${{ needs.fork-plan.outputs.kernel_version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          WHEELS=(wheels/*.whl)
          if [ ${#WHEELS[@]} -eq 0 ]; then
            echo "no sglang-kernel wheel was built" >&2
            exit 1
          fi
          TAG="sglang-kernel-v${{ needs.fork-plan.outputs.kernel_version }}"
          # Releases here are immutable once published, so a release is created
          # with its wheels in one call and never gets assets added later.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "${WHEELS[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "sglang-kernel ${{ needs.fork-plan.outputs.kernel_version }}" \
              --notes "sglang-kernel ${{ needs.fork-plan.outputs.kernel_version }} built from ${GITHUB_SHA}. Install: pip install sglang-kernel==${{ needs.fork-plan.outputs.kernel_version }} --find-links https://github.com/${GITHUB_REPOSITORY}/releases/expanded_assets/${TAG}"
            exit 0
          fi
          EXISTING=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          BUILT_FROM=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
          aot_tree() {
            gh api "repos/${GITHUB_REPOSITORY}/contents/python/sglang/kernels?ref=$1" --jq '.[] | select(.name == "aot") | .sha'
          }
          PUBLISHED_TREE=$(aot_tree "$BUILT_FROM")
          CURRENT_TREE=$(aot_tree "$GITHUB_SHA")
          : "${PUBLISHED_TREE:?no kernel source tree at $BUILT_FROM}" "${CURRENT_TREE:?no kernel source tree at $GITHUB_SHA}"
          echo "kernel tree at release commit $BUILT_FROM: $PUBLISHED_TREE; at $GITHUB_SHA: $CURRENT_TREE"
          for WHEEL in "${WHEELS[@]}"; do
            NAME=$(basename "$WHEEL")
            if ! printf '%s\n' "$EXISTING" | grep -qxF "$NAME"; then
              echo "::error::release $TAG is published without $NAME and cannot take new assets; bump the kernel version (scripts/release/bump_kernel_version.py)"
              exit 1
            fi
            if [ "$PUBLISHED_TREE" != "$CURRENT_TREE" ]; then
              # One version must mean one op set: a wheel already published under
              # this version would silently lack whatever this change adds.
              echo "::error::$NAME is already published; bump the kernel version (scripts/release/bump_kernel_version.py, then bump_kernel_version_to_sglang.py) to ship a changed kernel"
              exit 1
            fi
            echo "$NAME already published; keeping it"
          done

  # Builds in parallel with the tests and pushes by digest only; fork-docker-manifest tags it once every test job passes.
  fork-docker-image:
    needs: [fork-plan, fork-sgl-kernel-wheel, fork-rust-ext-build]
    if: ${{ !cancelled() && needs.fork-plan.result == 'success' && needs.fork-plan.outputs.build_docker == 'true' && (needs.fork-sgl-kernel-wheel.result == 'success' || needs.fork-sgl-kernel-wheel.result == 'skipped') && needs.fork-rust-ext-build.outputs.artifact_name != '' }}
    name: fork-docker-image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, platform: linux/amd64, suffix: amd64, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      digest_amd64: ${{ steps.build.outputs.digest_amd64 }}
    steps:
      # One rm per directory, all running at once; a single sequential rm of this list took three to four minutes.
      - name: Free disk space
        run: |
          df -h / /mnt || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          printf '%s\n' \
            /usr/share/dotnet /usr/share/swift /usr/share/miniconda /usr/share/az_* \
            /usr/local/lib/android /usr/local/lib/node_modules /usr/local/share/boost \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/vcpkg \
            /usr/local/.ghcup /usr/local/julia* /usr/local/aws-cli /usr/local/aws-sam-cli \
            /usr/lib/jvm /usr/lib/google-cloud-sdk /usr/lib/firefox /usr/lib/mono \
            /opt/ghc /opt/hostedtoolcache /opt/az /opt/microsoft /opt/google /opt/pipx \
            /opt/mssql-tools /opt/pipx_bin /opt/actionarchivecache \
            | sudo xargs -P 0 -n 1 rm -rf || true
          docker system prune -af --volumes || true
          sudo apt-get clean || true
          df -h / /mnt || true

      # BuildKit's snapshots and the swap file go on separate disks, the larger one (usually the /mnt scratch disk) holding the snapshots.
      - name: Move Docker to the larger disk and add swap
        run: |
          set -euo pipefail
          ROOT_AVAIL=$(df --output=avail -B1 / | tail -1)
          MNT_AVAIL=$(df --output=avail -B1 /mnt 2>/dev/null | tail -1 || echo 0)
          SWAP_DIR=/mnt
          if [ "${MNT_AVAIL:-0}" -gt "$ROOT_AVAIL" ]; then
            sudo systemctl stop docker docker.socket
            sudo mkdir -p /mnt/docker
            CONF=/etc/docker/daemon.json
            if sudo test -s "$CONF"; then sudo cat "$CONF"; else echo '{}'; fi \
              | jq '. + {"data-root": "/mnt/docker"}' > "${{ runner.temp }}/daemon.json"
            sudo install -m 644 "${{ runner.temp }}/daemon.json" "$CONF"
            sudo systemctl start docker
            SWAP_DIR=""
          fi
          sudo fallocate -l 16G "${SWAP_DIR}/swapfile-docker-build"
          sudo chmod 600 "${SWAP_DIR}/swapfile-docker-build"
          sudo mkswap "${SWAP_DIR}/swapfile-docker-build"
          sudo swapon "${SWAP_DIR}/swapfile-docker-build"
          docker info --format 'Docker root: {{.DockerRootDir}}'
          free -g
          df -h / /mnt || true

      - uses: actions/checkout@v4

      # The Dockerfile runs go-toolchain, an APE, which the build container can only exec through the host's handler.
      - name: Register the APE binfmt handler
        run: |
          curl -fsSL --retry 3 -o "${{ runner.temp }}/register-ape-binfmt.sh" \
            https://raw.githubusercontent.com/wow-look-at-my/go-toolchain/master/.github/scripts/register-ape-binfmt.sh
          bash "${{ runner.temp }}/register-ape-binfmt.sh"

      # The PyO3 modules fork-rust-ext-build compiled for the CPU suite; the image installs them instead of compiling rust/ again.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.fork-rust-ext-build.outputs.artifact_name }}
          path: ${{ runner.temp }}/rust-ext-modules

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The layer cache lives next to the image on ghcr.io: the image is far larger than the 10 GB Actions cache, which also holds the kernel caches.
      - name: Build and push ${{ matrix.platform }}
        id: build
        env:
          KERNEL_VERSION: ${{ needs.fork-plan.outputs.kernel_version }}
          GPU_ARCHS: ${{ needs.fork-plan.outputs.cuda_archs }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sglang"
          CACHE="${IMAGE}:buildcache-${{ matrix.suffix }}"
          # A branch reads the default branch's cache and writes its own, so it never evicts the default branch's layers.
          CACHE_TO="$CACHE"
          if [ '${{ needs.fork-plan.outputs.on_default }}' != true ]; then
            CACHE_TO="${CACHE}-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-100)"
          fi
          KERNEL_WHEEL_IMAGE="${IMAGE}:sgl-kernel-wheel-${{ matrix.arch }}-${{ needs.fork-plan.outputs.kernel_key }}"
          # Same bound as python/sglang/kernels/aot/build.sh: a CUDA or CUTLASS
          # translation unit can peak near 10 GB, so jobs <= (RAM + swap) / 10 GB.
          MEM_JOBS=$(awk '/^(MemTotal|SwapTotal):/ {kb += $2} END {print int(kb / (10 * 1024 * 1024))}' /proc/meminfo)
          BUILD_JOBS=$(printf '%s\n' "$(nproc)" "$MEM_JOBS" | sort -n | head -1)
          [ "$BUILD_JOBS" -ge 1 ] || BUILD_JOBS=1
          echo "BUILD_JOBS=${BUILD_JOBS} GPU_ARCHS=${GPU_ARCHS} sglang-kernel ${KERNEL_VERSION}"
          docker buildx build \
            --target framework_final \
            --platform ${{ matrix.platform }} \
            -f docker/Dockerfile \
            --build-arg CUDA_VERSION=13.0.3 \
            --build-arg BUILD_TYPE=all \
            --build-arg BRANCH_TYPE=local \
            --build-arg INSTALL_FLASHINFER_JIT_CACHE=1 \
            --build-arg GPU_ARCHS="${GPU_ARCHS}" \
            --build-arg BUILD_JOBS="${BUILD_JOBS}" \
            --build-arg INSTALL_GATEWAY=0 \
            --build-arg SGL_KERNEL_VERSION="${KERNEL_VERSION}" \
            --build-arg SGL_KERNEL_WHEEL_REQUIRED=1 \
            --build-arg SGLANG_BUILD_COMMIT="${GITHUB_SHA}" \
            --build-context sgl_kernel_wheels="docker-image://${KERNEL_WHEEL_IMAGE}" \
            --build-context rust_ext_modules="${RUNNER_TEMP}/rust-ext-modules" \
            --cache-from "type=registry,ref=${CACHE}" \
            --cache-from "type=registry,ref=${CACHE_TO}" \
            --cache-to "type=registry,ref=${CACHE_TO},mode=max,ignore-error=true,oci-mediatypes=true,compression=zstd,compression-level=12" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true,compression=zstd,compression-level=12,force-compression=true" \
            --metadata-file "${RUNNER_TEMP}/build-metadata.json" \
            .
          DIGEST=$(jq -er '."containerimage.digest"' "${RUNNER_TEMP}/build-metadata.json")
          echo "digest_${{ matrix.suffix }}=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Disk and memory after the build
        if: always()
        run: |
          df -h / /mnt || true
          free -g || true

  # Publishes only a tree that passed every test job.
  fork-docker-manifest:
    needs: [fork-plan, fork-docker-image, fork-init-order-check, base-a-test-cpu, simulator-test-cpu, fork-gateway-test, fork-gateway-wheel, fork-gateway-golang]
    if: ${{ !cancelled() && needs.fork-plan.outputs.build_docker == 'true' && needs.fork-docker-image.result == 'success' && needs.fork-init-order-check.result == 'success' && needs.base-a-test-cpu.result == 'success' && needs.simulator-test-cpu.result == 'success' && needs.fork-gateway-test.result == 'success' && needs.fork-gateway-wheel.result == 'success' && needs.fork-gateway-golang.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Join the per-arch images under each tag
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sglang"
          for TAG in ${{ needs.fork-plan.outputs.image_tags }}; do
            SOURCES=()
            for DIGEST in ${{ needs.fork-docker-image.outputs.digest_amd64 }}; do
              docker buildx imagetools create -t "${IMAGE}:${TAG}-amd64" "${IMAGE}@${DIGEST}"
              SOURCES+=("${IMAGE}@${DIGEST}")
            done
            if [ ${#SOURCES[@]} -eq 0 ]; then
              echo "no per-arch image was pushed for ${TAG}" >&2
              exit 1
            fi
            docker buildx imagetools create -t "${IMAGE}:${TAG}" "${SOURCES[@]}"
            echo "Published ${IMAGE}:${TAG} from ${SOURCES[*]}" >> "$GITHUB_STEP_SUMMARY"
          done
