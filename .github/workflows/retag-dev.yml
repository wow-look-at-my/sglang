name: Retag dev

on:
  push:
    branches: [retag-dev]

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  packages: write

jobs:
  retag:
    if: github.repository != 'sgl-project/sglang'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Point dev and dev-c33f439 at the c33f439 image
        run: |
          set -euo pipefail
          SOURCE="ghcr.io/wow-look-at-my/sglang@sha256:de24d5ce75fe97f6b92ebea55e775ea375e5cae2670f1c30f5d672ed2ca0f008"
          docker buildx imagetools create -t ghcr.io/wow-look-at-my/sglang:dev -t ghcr.io/wow-look-at-my/sglang:dev-c33f439 "$SOURCE"
          docker buildx imagetools inspect ghcr.io/wow-look-at-my/sglang:dev
