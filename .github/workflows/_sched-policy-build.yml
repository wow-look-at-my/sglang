name: Build sched-policy

on:
  workflow_call:
    inputs:
      git_ref:
        description: 'Ref to build; empty builds the triggering commit.'
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      deployments: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - uses: wow-look-at-my/go-toolchain@drop-common-checks
        with:
          working-directory: tools/sched-policy

      # Jobs that start a scheduler download this; the scheduler spawns it as its policy process.
      - uses: actions/upload-artifact@v4
        with:
          name: sglang-sched-policy
          path: tools/sched-policy/build/sglang-sched-policy
          if-no-files-found: error
